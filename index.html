<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Báo Thanh Khoản VNINDEX</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Prop Types & Recharts (Phiên bản ổn định cho trình duyệt) -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    
    <div id="root"></div>

    <!-- Code React biên dịch trực tiếp -->
    <script type="text/babel">
        const { useState } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot } = Recharts;

        // --- MOCK DATA ---
        const chartData = [
            { time: 'T1/2026', historical: 26500 },
            { time: 'T2/2026', historical: 21200 },
            { time: 'T3/2026', historical: 19800 },
            { time: 'T4/2026', historical: 24500 },
            { time: 'T5/2026', historical: 15400 },
            { time: 'Hiện tại', historical: 18223, base: 18223, bull: 18223, bear: 18223 },
            { time: 'T7/2026', base: 21500, bull: 23000, bear: 19500 },
            { time: 'T8/2026', base: 24200, bull: 26500, bear: 20800 },
            { time: 'T9/2026', base: 26000, bull: 28800, bear: 22000 },
            { time: 'T10/2026', base: 27500, bull: 30500, bear: 23200 },
            { time: 'T11/2026', base: 28800, bull: 31400, bear: 24500 },
            { time: 'T12/2026', base: 29746, bull: 32208, bear: 25227 },
        ];

        const currentMetrics = {
            vnindex: 1854.10,
            gtgd: 18223.91,
            interest: 0.06,
            fx: 26138,
            foreign: -1347.11
        };

        // --- ICONS (Chuyển thành pure SVG để không cần cài đặt thư viện) ---
        const Activity = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const BarChart2 = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>;
        const Percent = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="6.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>;
        const DollarSign = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>;
        const TrendingDown = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>;
        const TrendingUp = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const AlertCircle = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;

        const MetricCard = ({ title, value, icon: Icon, colorClass, suffix = "" }) => (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-slate-500 text-sm font-medium mb-1">{title}</p>
                        <h3 className={`text-2xl font-bold ${colorClass}`}>
                            {value.toLocaleString('vi-VN')} {suffix}
                        </h3>
                    </div>
                    <div className={`p-3 rounded-lg ${colorClass.replace('text-', 'bg-').replace('600', '100').replace('500', '100').replace('800', '100')} bg-opacity-20`}>
                        <div className={colorClass}><Icon /></div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [activeLines, setActiveLines] = useState({ base: true, bull: true, bear: true });

            const toggleLine = (dataKey) => {
                setActiveLines(prev => ({ ...prev, [dataKey]: !prev[dataKey] }));
            };

            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    return (
                        <div className="bg-white/95 backdrop-blur-sm border border-slate-200 p-4 rounded-xl shadow-xl">
                            <p className="font-bold text-slate-800 mb-2 border-b pb-2">{label}</p>
                            {payload.map((entry, index) => (
                                <div key={index} className="flex items-center justify-between mb-1 gap-6">
                                    <span style={{ color: entry.color }} className="font-medium text-sm flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: entry.color }}></div>
                                        {entry.name}:
                                    </span>
                                    <span className="font-bold text-slate-700">
                                        {entry.value.toLocaleString('vi-VN')} tỷ
                                    </span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="p-6 md:p-8">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* HEADER */}
                        <header className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-200 pb-6">
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <div className="w-3 h-3 rounded-full bg-blue-600 animate-pulse"></div>
                                    <span className="text-sm font-semibold text-blue-600 tracking-wider uppercase">Live Dashboard</span>
                                </div>
                                <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">Dự Báo Thanh Khoản VNINDEX</h1>
                                <p className="text-slate-500 mt-1">Mô hình phân tích định lượng (Quantitative Analysis Model) - Cuối năm 2026</p>
                            </div>
                        </header>

                        {/* METRICS */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                            <MetricCard title="Điểm số VNINDEX" value={currentMetrics.vnindex} icon={Activity} colorClass="text-slate-800" />
                            <MetricCard title="GTGD Hiện tại" value={currentMetrics.gtgd} icon={BarChart2} colorClass="text-indigo-600" suffix="Tỷ" />
                            <MetricCard title="Lãi suất (Big 4)" value={currentMetrics.interest} icon={Percent} colorClass="text-emerald-600" suffix="%" />
                            <MetricCard title="Tỷ giá USD/VND" value={currentMetrics.fx} icon={DollarSign} colorClass="text-amber-600" />
                            <MetricCard title="Khối ngoại (Net)" value={currentMetrics.foreign} icon={TrendingDown} colorClass="text-rose-600" suffix="Tỷ" />
                        </div>

                        {/* CHART */}
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex justify-between items-center mb-6">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800">Biểu đồ Xu hướng & Dự báo Kịch bản</h2>
                                    <p className="text-sm text-slate-500">Bấm vào các kịch bản bên dưới để Tắt/Bật đường dự báo tương ứng</p>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => toggleLine('bull')} className={`px-3 py-1.5 rounded-full text-sm font-medium transition-all ${activeLines.bull ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-400'}`}>Tích cực</button>
                                    <button onClick={() => toggleLine('base')} className={`px-3 py-1.5 rounded-full text-sm font-medium transition-all ${activeLines.base ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-400'}`}>Cơ sở</button>
                                    <button onClick={() => toggleLine('bear')} className={`px-3 py-1.5 rounded-full text-sm font-medium transition-all ${activeLines.bear ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-400'}`}>Tiêu cực</button>
                                </div>
                            </div>
                            
                            <div className="h-[400px] w-full mt-4">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={chartData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                        <XAxis dataKey="time" tick={{fill: '#64748b', fontSize: 13}} axisLine={false} tickLine={false} dy={10} />
                                        <YAxis domain={['auto', 'auto']} tickFormatter={(val) => `${val.toLocaleString()} Tỷ`} tick={{fill: '#64748b', fontSize: 13}} axisLine={false} tickLine={false} dx={-10} />
                                        <Tooltip content={<CustomTooltip />} />
                                        
                                        <Line type="monotone" dataKey="historical" name="Lịch sử (Thực tế)" stroke="#1e293b" strokeWidth={3} dot={false} activeDot={{ r: 6, fill: '#1e293b', stroke: '#fff', strokeWidth: 2 }} />
                                        {activeLines.bull && <Line type="monotone" dataKey="bull" name="Kịch bản Tích cực" stroke="#10b981" strokeWidth={3} strokeDasharray="6 6" dot={false} />}
                                        {activeLines.base && <Line type="monotone" dataKey="base" name="Kịch bản Cơ sở" stroke="#3b82f6" strokeWidth={3} strokeDasharray="6 6" dot={false} />}
                                        {activeLines.bear && <Line type="monotone" dataKey="bear" name="Kịch bản Tiêu cực" stroke="#ef4444" strokeWidth={3} strokeDasharray="6 6" dot={false} />}
                                        <ReferenceDot x="Hiện tại" y={18223} r={6} fill="#3b82f6" stroke="white" strokeWidth={2} />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* SCENARIO DETAILS */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {/* Tích cực */}
                            <div className="bg-white p-6 rounded-2xl border-t-4 border-t-green-500 shadow-sm">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Kịch bản Tích cực</h3>
                                        <span className="inline-block mt-1 px-2.5 py-0.5 bg-green-100 text-green-700 text-xs font-bold rounded-full">Xác suất: 30%</span>
                                    </div>
                                    <div className="text-green-500 opacity-20"><TrendingUp /></div>
                                </div>
                                <div className="text-3xl font-black text-green-600 mb-4">32,208 <span className="text-sm font-medium text-slate-500">Tỷ/phiên</span></div>
                                <ul className="space-y-2 text-sm text-slate-600">
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-green-500"></div> Tỷ giá hạ nhiệt cực mạnh</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-green-500"></div> Khối ngoại đảo chiều mua ròng</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-green-500"></div> Lãi suất giảm kích thích dòng tiền nội</li>
                                </ul>
                            </div>

                            {/* Cơ sở */}
                            <div className="bg-white p-6 rounded-2xl border-t-4 border-t-blue-500 shadow-sm relative transform md:-translate-y-4 shadow-xl ring-1 ring-slate-900/5">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-full">KỴ VỌNG NHẤT</div>
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Kịch bản Cơ sở</h3>
                                        <span className="inline-block mt-1 px-2.5 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">Xác suất: 50%</span>
                                    </div>
                                    <div className="text-blue-500 opacity-20"><Activity /></div>
                                </div>
                                <div className="text-3xl font-black text-blue-600 mb-4">29,746 <span className="text-sm font-medium text-slate-500">Tỷ/phiên</span></div>
                                <ul className="space-y-2 text-sm text-slate-600">
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div> Vĩ mô ổn định không có cú sốc</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div> Bán ròng khối ngoại quanh mốc 150 tỷ</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div> Biên độ dao động kỹ thuật bình thường</li>
                                </ul>
                            </div>

                            {/* Tiêu cực */}
                            <div className="bg-white p-6 rounded-2xl border-t-4 border-t-red-500 shadow-sm">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Kịch bản Tiêu cực</h3>
                                        <span className="inline-block mt-1 px-2.5 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">Xác suất: 20%</span>
                                    </div>
                                    <div className="text-red-500 opacity-20"><AlertCircle /></div>
                                </div>
                                <div className="text-3xl font-black text-red-600 mb-4">25,227 <span className="text-sm font-medium text-slate-500">Tỷ/phiên</span></div>
                                <ul className="space-y-2 text-sm text-slate-600">
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-500"></div> Tỷ giá căng thẳng vượt mốc hiện tại</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-500"></div> Lãi suất điều hành nhích tăng</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-500"></div> Áp lực bán ròng khối ngoại lan rộng</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
